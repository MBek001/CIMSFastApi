<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CIMS Tasklar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg0: #fbfbfd;
      --bg1: #f2f2f7;
      --glass: rgba(255, 255, 255, 0.58);
      --glass-strong: rgba(255, 255, 255, 0.74);
      --text: #101114;
      --muted: rgba(60, 60, 67, 0.68);
      --line: rgba(255, 255, 255, 0.62);
      --blue: #007aff;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
      --violet: #af52de;
      --shadow: 0 24px 70px rgba(31, 35, 48, 0.16);
      --inner: inset 0 1px 0 rgba(255,255,255,0.68), inset 0 -1px 0 rgba(255,255,255,0.22);
      --radius: 24px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg0: #050508;
        --bg1: #111217;
        --glass: rgba(28, 28, 33, 0.56);
        --glass-strong: rgba(42, 42, 48, 0.76);
        --text: #f5f5f7;
        --muted: rgba(235, 235, 245, 0.62);
        --line: rgba(255, 255, 255, 0.13);
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        --inner: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(255,255,255,0.06);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% -4%, rgba(0, 122, 255, 0.32), transparent 30%),
        radial-gradient(circle at 86% 4%, rgba(175, 82, 222, 0.22), transparent 28%),
        radial-gradient(circle at 50% 74%, rgba(52, 199, 89, 0.12), transparent 32%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,0.18) 47%, transparent 58%),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.22), transparent 40%);
      mix-blend-mode: soft-light;
    }
    .shell {
      max-width: 520px;
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px 18px;
    }
    .title {
      margin: 0;
      font-size: 32px;
      line-height: 1.02;
      letter-spacing: -0.9px;
      font-weight: 800;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }
    .refresh {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: var(--glass);
      box-shadow: var(--shadow), var(--inner);
      font-size: 20px;
      backdrop-filter: blur(28px) saturate(1.8);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      margin-bottom: 14px;
      border-radius: 20px;
      background: rgba(118, 118, 128, 0.18);
      box-shadow: var(--inner);
      backdrop-filter: blur(26px) saturate(1.6);
    }
    .tab {
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      font-size: 15px;
      font-weight: 700;
    }
    .tab.active {
      color: var(--text);
      background: var(--glass-strong);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12), var(--inner);
    }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--glass);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.1), var(--inner);
      backdrop-filter: blur(28px) saturate(1.8);
    }
    .metric .num {
      font-size: 27px;
      font-weight: 850;
      letter-spacing: -0.6px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .card {
      position: relative;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, var(--glass-strong), var(--glass));
      box-shadow: 0 16px 46px rgba(0, 0, 0, 0.13), var(--inner);
      backdrop-filter: blur(34px) saturate(1.9);
      animation: pop 260ms ease both;
      overflow: hidden;
      transition: padding 260ms cubic-bezier(.2,.9,.2,1), transform 220ms ease, border-radius 260ms ease;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, rgba(255,255,255,0.32), transparent 24%, transparent 70%, rgba(255,255,255,0.12));
      opacity: 0.7;
    }
    .card.expanded {
      padding: 17px;
      border-radius: 28px;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 0;
      position: relative;
      z-index: 1;
    }
    .task-title {
      font-size: 15.5px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.25px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card.expanded .task-title {
      font-size: 17px;
      -webkit-line-clamp: unset;
    }
    .badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      background: rgba(0, 122, 255, 0.14);
      color: var(--blue);
      box-shadow: var(--inner);
    }
    .badge.done { color: var(--green); background: rgba(52, 199, 89, 0.12); }
    .badge.overdue { color: var(--red); background: rgba(255, 59, 48, 0.12); }
    .meta {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 12px;
    }
    .desc {
      margin-top: 10px;
      color: var(--text);
      opacity: 0.82;
      font-size: 14px;
      line-height: 1.38;
      white-space: pre-wrap;
    }
    .expand {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 320ms cubic-bezier(.2,.9,.2,1), opacity 220ms ease, margin-top 260ms ease;
      position: relative;
      z-index: 1;
    }
    .expand > div {
      overflow: hidden;
    }
    .card.expanded .expand {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 10px;
    }
    .quick-meta {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }
    .card.expanded .quick-meta { display: none; }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }
    .status-btn {
      min-height: 44px;
      border: 0;
      border-radius: 15px;
      background: rgba(118, 118, 128, 0.18);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      box-shadow: var(--inner);
    }
    .status-btn.current {
      background: linear-gradient(135deg, rgba(0,122,255,0.96), rgba(88,86,214,0.92));
      color: white;
    }
    .empty, .error {
      padding: 28px 20px;
      border-radius: var(--radius);
      text-align: center;
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(1.7);
      color: var(--muted);
      font-weight: 700;
      line-height: 1.4;
    }
    .error { color: var(--red); }
    .loader {
      padding: 36px 0;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }
    button { cursor: pointer; touch-action: manipulation; }
    button:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      .card, .expand, button { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="top">
      <div>
        <h1 class="title">Tasklar</h1>
        <div class="subtitle" id="userLine">CIMS Task Bot</div>
      </div>
      <button class="refresh" id="refreshBtn" aria-label="Yangilash">↻</button>
    </section>

    <section class="tabs">
      <button class="tab active" data-filter="open" id="openTab">🔥 Ochiq</button>
      <button class="tab" data-filter="done" id="doneTab">✅ Done</button>
    </section>

    <section class="summary">
      <div class="metric">
        <div class="num" id="openCount">0</div>
        <div class="label">Ochiq task</div>
      </div>
      <div class="metric">
        <div class="num" id="doneCount">0</div>
        <div class="label">Done task</div>
      </div>
    </section>

    <section id="content" class="list">
      <div class="loader">Yuklanmoqda...</div>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const state = { filter: "open", initData: tg?.initData || "" };
    const content = document.getElementById("content");
    const userLine = document.getElementById("userLine");
    const openCount = document.getElementById("openCount");
    const doneCount = document.getElementById("doneCount");

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#f5f5f7");
      tg.setBackgroundColor("#f5f5f7");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function formatDate(value) {
      if (!value) return "Belgilanmagan";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("uz-UZ", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function setActiveTab() {
      document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === state.filter);
      });
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": state.initData,
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "So'rov bajarilmadi");
      return data;
    }

    function renderTasks(tasks) {
      if (!tasks.length) {
        content.innerHTML = `<div class="empty">${state.filter === "done" ? "✅ Done task yo'q" : "📭 Ochiq task yo'q"}</div>`;
        return;
      }
      content.innerHTML = tasks.map((task, index) => {
        const badgeClass = task.is_overdue ? "overdue" : (task.is_done ? "done" : "");
        const badgeText = task.is_overdue ? "⚠️ Kechikkan" : `${task.status_emoji} ${escapeHtml(task.column_name)}`;
        const buttons = task.status_options.map(option => `
          <button class="status-btn ${option.id === task.column_id ? "current" : ""}" data-card="${task.id}" data-column="${option.id}">
            ${escapeHtml(option.emoji)} ${escapeHtml(option.name)}
          </button>
        `).join("");
        return `
          <article class="card" data-card-id="${task.id}" style="animation-delay:${Math.min(index * 28, 220)}ms">
            <div class="card-head">
              <div class="task-title">#${task.id} · ${escapeHtml(task.title)}</div>
              <div class="badge ${badgeClass}">${badgeText}</div>
            </div>
            <div class="quick-meta">
              <span>🗂 ${escapeHtml(task.project_name)}</span>
              <span>📅 ${formatDate(task.due_date)}</span>
            </div>
            <div class="expand">
              <div>
                ${task.description ? `<div class="desc">${escapeHtml(task.description)}</div>` : ""}
                <div class="meta">
                  <div>🗂 ${escapeHtml(task.project_name)} / ${escapeHtml(task.board_name)}</div>
                  <div>📅 ${formatDate(task.due_date)} · 🎯 ${escapeHtml(task.priority)}</div>
                </div>
                <div class="status-grid">${buttons}</div>
              </div>
            </div>
          </article>
        `;
      }).join("");
      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest(".status-btn")) return;
          const wasExpanded = card.classList.contains("expanded");
          document.querySelectorAll(".card.expanded").forEach(item => {
            if (item !== card) item.classList.remove("expanded");
          });
          card.classList.toggle("expanded", !wasExpanded);
          if (!wasExpanded && tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        });
      });
      document.querySelectorAll(".status-btn").forEach(button => {
        button.addEventListener("click", () => updateStatus(Number(button.dataset.card), Number(button.dataset.column)));
      });
    }

    async function loadTasks() {
      setActiveTab();
      content.innerHTML = `<div class="loader">Yuklanmoqda...</div>`;
      try {
        const data = await api(`/projects/task-webapp/tasks?status=${state.filter}`);
        const fullName = `${data.user?.name || ""} ${data.user?.surname || ""}`.trim();
        userLine.textContent = fullName || "CIMS Task Bot";
        openCount.textContent = data.counts?.open ?? 0;
        doneCount.textContent = data.counts?.done ?? 0;
        renderTasks(data.tasks || []);
      } catch (error) {
        content.innerHTML = `<div class="error">⛔ ${escapeHtml(error.message)}<br><br>Botga /start bosing va qayta oching.</div>`;
      }
    }

    async function updateStatus(cardId, columnId) {
      try {
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        await api(`/projects/task-webapp/tasks/${cardId}/status`, {
          method: "PATCH",
          body: JSON.stringify({ column_id: columnId })
        });
        await loadTasks();
      } catch (error) {
        if (tg?.showAlert) tg.showAlert(error.message);
        else alert(error.message);
      }
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        loadTasks();
      });
    });
    document.getElementById("refreshBtn").addEventListener("click", loadTasks);
    loadTasks();
  </script>
</body>
</html>
