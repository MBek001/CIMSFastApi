<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CIMS Tasklar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --ink: #f7fff5;
      --muted: rgba(235, 246, 232, 0.62);
      --weak: rgba(235, 246, 232, 0.38);
      --glass: rgba(23, 27, 24, 0.46);
      --glass-2: rgba(64, 70, 62, 0.34);
      --rim: rgba(255, 255, 255, 0.2);
      --rim-hot: rgba(255, 255, 255, 0.42);
      --green: #5dff63;
      --green-soft: rgba(93, 255, 99, 0.18);
      --blue: #64d2ff;
      --orange: #ffd60a;
      --red: #ff453a;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.58);
      --inner: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 0%, rgba(93, 255, 99, 0.18), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.12), transparent 18%),
        radial-gradient(circle at 48% 90%, rgba(100, 210, 255, 0.13), transparent 31%),
        linear-gradient(145deg, #020403 0%, #121512 44%, #020403 100%);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: -15%;
      pointer-events: none;
    }
    body::before {
      background:
        linear-gradient(118deg, transparent 0 39%, rgba(255,255,255,0.16) 45%, transparent 52%),
        radial-gradient(ellipse at 52% 42%, transparent 0 34%, rgba(255,255,255,0.055) 35%, transparent 48%);
      filter: blur(2px);
      mix-blend-mode: screen;
      animation: ambient 12s ease-in-out infinite alternate;
    }
    body::after {
      background: radial-gradient(circle at var(--mx, 54%) var(--my, 15%), rgba(255,255,255,0.22), transparent 16%);
      opacity: 0.65;
      filter: blur(18px);
    }
    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    .app {
      position: relative;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 18px;
    }
    .hello {
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0.2px;
    }
    .title {
      margin: 4px 0 0;
      font-size: 34px;
      line-height: 0.94;
      letter-spacing: -1.4px;
      font-weight: 900;
    }
    .round {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 19px;
      background:
        linear-gradient(140deg, rgba(255,255,255,0.2), rgba(255,255,255,0.04)),
        rgba(44, 50, 45, 0.42);
      border: 1px solid var(--rim);
      box-shadow: var(--shadow), var(--inner);
      backdrop-filter: blur(34px) saturate(1.7);
    }
    .glass {
      position: relative;
      border: 1px solid var(--rim);
      background:
        radial-gradient(circle at var(--card-x, 20%) 0%, rgba(255,255,255,0.24), transparent 30%),
        linear-gradient(150deg, rgba(255,255,255,0.17), rgba(255,255,255,0.045) 45%, rgba(255,255,255,0.11));
      box-shadow: var(--shadow), var(--inner);
      backdrop-filter: blur(36px) saturate(1.75);
      overflow: hidden;
      isolation: isolate;
    }
    .glass::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(122deg, rgba(255,255,255,0.25), transparent 23%, transparent 70%, rgba(255,255,255,0.13));
      opacity: 0.72;
      pointer-events: none;
      z-index: -1;
    }
    .glass::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.78), transparent);
      pointer-events: none;
    }
    .scene {
      min-height: 156px;
      border-radius: 34px;
      padding: 16px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
    }
    .scene-title {
      position: relative;
      z-index: 1;
      font-size: 15px;
      font-weight: 820;
      color: var(--muted);
    }
    .big-number {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      font-size: 58px;
      line-height: 0.88;
      letter-spacing: -3px;
      font-weight: 930;
    }
    .big-number span {
      color: var(--green);
      text-shadow: 0 0 22px rgba(93,255,99,0.5);
    }
    .scene-sub {
      position: relative;
      z-index: 1;
      margin-top: 9px;
      color: var(--weak);
      font-size: 13px;
      font-weight: 760;
    }
    .mini-grid {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 9px;
    }
    .mini {
      border-radius: 24px;
      padding: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: var(--inner);
    }
    .mini .value {
      font-size: 25px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.8px;
    }
    .mini .label {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }
    .dock {
      position: sticky;
      top: calc(10px + env(safe-area-inset-top));
      z-index: 8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: 0 18px 48px rgba(0,0,0,0.36), var(--inner);
      backdrop-filter: blur(32px) saturate(1.9);
    }
    .tab {
      min-height: 42px;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 880;
      transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }
    .tab.active {
      color: #061008;
      background: linear-gradient(135deg, rgba(93,255,99,0.98), rgba(211,255,207,0.9));
      box-shadow: 0 0 30px rgba(93,255,99,0.32), inset 0 1px 0 rgba(255,255,255,0.74);
    }
    .tasks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .task {
      min-height: 126px;
      border-radius: 27px;
      animation: rise 360ms cubic-bezier(.2,.95,.18,1) both;
      transition: grid-column 320ms cubic-bezier(.2,.95,.18,1), border-radius 320ms cubic-bezier(.2,.95,.18,1), transform 220ms ease, border-color 220ms ease;
    }
    .task.expanded {
      grid-column: 1 / -1;
      border-radius: 36px;
      border-color: var(--rim-hot);
      transform: translateY(-1px);
    }
    .task-body {
      position: relative;
      z-index: 1;
      padding: 13px;
    }
    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .device-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(93,255,99,0.76);
      flex: 0 0 auto;
    }
    .device-dot.done {
      background: var(--blue);
      box-shadow: 0 0 16px rgba(100,210,255,0.64);
    }
    .device-dot.overdue {
      background: var(--red);
      box-shadow: 0 0 16px rgba(255,69,58,0.72);
    }
    .status-pill {
      max-width: calc(100% - 22px);
      padding: 6px 8px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 11px;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-title {
      min-height: 38px;
      font-size: 14px;
      line-height: 1.18;
      letter-spacing: -0.2px;
      font-weight: 880;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .task.expanded .task-title {
      min-height: auto;
      font-size: 19px;
      line-height: 1.12;
      letter-spacing: -0.5px;
      -webkit-line-clamp: unset;
    }
    .task-meta {
      display: grid;
      gap: 5px;
      margin-top: 12px;
      color: var(--weak);
      font-size: 11.7px;
      line-height: 1.2;
      font-weight: 780;
    }
    .task-meta div {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task.expanded .task-meta {
      grid-template-columns: 1fr 1fr;
      color: var(--muted);
      font-size: 13px;
    }
    .reveal {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 380ms cubic-bezier(.2,.95,.18,1), opacity 260ms ease, margin-top 260ms ease;
    }
    .task.expanded .reveal {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 12px;
    }
    .reveal-inner { overflow: hidden; }
    .desc {
      color: rgba(247,255,245,0.84);
      font-size: 14px;
      line-height: 1.42;
      white-space: pre-wrap;
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .status {
      min-height: 42px;
      border-radius: 16px;
      color: var(--ink);
      background: rgba(255,255,255,0.075);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--inner);
      font-size: 13px;
      font-weight: 860;
    }
    .status.current {
      color: #051006;
      background: linear-gradient(135deg, var(--green), #d7ffd2);
      border-color: rgba(255,255,255,0.56);
      box-shadow: 0 0 28px rgba(93,255,99,0.32), var(--inner);
    }
    .empty, .loader, .error {
      grid-column: 1 / -1;
      padding: 30px 18px;
      border-radius: 32px;
      text-align: center;
      color: var(--muted);
      font-weight: 780;
      line-height: 1.45;
    }
    .error { color: var(--red); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes ambient {
      from { transform: translate3d(-2%, -1%, 0) rotate(-2deg); }
      to { transform: translate3d(2%, 1%, 0) rotate(2deg); }
    }
    @media (max-width: 360px) {
      .tasks { grid-template-columns: 1fr; }
      .task.expanded { grid-column: auto; }
      .scene { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <div class="hello" id="userLine">CIMS Task Bot</div>
        <h1 class="title">Tasklar</h1>
      </div>
      <button class="round" id="refreshBtn" aria-label="Yangilash">↻</button>
    </section>

    <section class="glass scene">
      <div>
        <div class="scene-title">Bugungi ish paneli</div>
        <div class="big-number"><span id="openCount">0</span></div>
        <div class="scene-sub">Ochiq tasklar. Bosib oching, statusni o'zgartiring.</div>
      </div>
      <div class="mini-grid">
        <div class="mini">
          <div class="value" id="doneCount">0</div>
          <div class="label">Done task</div>
        </div>
        <div class="mini">
          <div class="value" id="visibleCount">0</div>
          <div class="label">Ko'rinyapti</div>
        </div>
      </div>
    </section>

    <section class="dock">
      <button class="tab active" data-filter="open">🔥 Ochiq</button>
      <button class="tab" data-filter="done">✅ Done</button>
    </section>

    <section id="content" class="tasks">
      <div class="glass loader">Yuklanmoqda...</div>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const state = { filter: "open", initData: tg?.initData || "" };
    const content = document.getElementById("content");
    const userLine = document.getElementById("userLine");
    const openCount = document.getElementById("openCount");
    const doneCount = document.getElementById("doneCount");
    const visibleCount = document.getElementById("visibleCount");

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#020403");
      tg.setBackgroundColor("#020403");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function formatDate(value) {
      if (!value) return "Deadline yo'q";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("uz-UZ", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function setPointer(event) {
      const x = Math.round((event.clientX / window.innerWidth) * 100);
      const y = Math.round((event.clientY / window.innerHeight) * 100);
      document.body.style.setProperty("--mx", `${x}%`);
      document.body.style.setProperty("--my", `${y}%`);
      const card = event.target.closest?.(".glass");
      if (card) card.style.setProperty("--card-x", `${x}%`);
    }

    function setActiveTab() {
      document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === state.filter);
      });
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": state.initData,
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "So'rov bajarilmadi");
      return data;
    }

    function renderTasks(tasks) {
      visibleCount.textContent = tasks.length;
      if (!tasks.length) {
        content.innerHTML = `<div class="glass empty">${state.filter === "done" ? "✅ Done task yo'q" : "📭 Ochiq task yo'q"}</div>`;
        return;
      }
      content.innerHTML = tasks.map((task, index) => {
        const badgeClass = task.is_overdue ? "overdue" : (task.is_done ? "done" : "");
        const badgeText = task.is_overdue ? "Kechikkan" : `${task.status_emoji} ${escapeHtml(task.column_name)}`;
        const buttons = task.status_options.map(option => `
          <button class="status ${option.id === task.column_id ? "current" : ""}" data-card="${task.id}" data-column="${option.id}">
            ${escapeHtml(option.emoji)} ${escapeHtml(option.name)}
          </button>
        `).join("");
        return `
          <article class="glass task" data-card-id="${task.id}" style="animation-delay:${Math.min(index * 28, 230)}ms">
            <div class="task-body">
              <div class="task-top">
                <span class="device-dot ${badgeClass}"></span>
                <span class="status-pill">${badgeText}</span>
              </div>
              <div class="task-title">#${task.id} · ${escapeHtml(task.title)}</div>
              <div class="task-meta">
                <div>🗂 ${escapeHtml(task.project_name)}</div>
                <div>📅 ${formatDate(task.due_date)}</div>
              </div>
              <div class="reveal">
                <div class="reveal-inner">
                  ${task.description ? `<div class="desc">${escapeHtml(task.description)}</div>` : ""}
                  <div class="task-meta">
                    <div>🧩 ${escapeHtml(task.board_name)}</div>
                    <div>🎯 ${escapeHtml(task.priority)}</div>
                  </div>
                  <div class="status-grid">${buttons}</div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
      document.querySelectorAll(".task").forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest(".status")) return;
          const wasExpanded = card.classList.contains("expanded");
          document.querySelectorAll(".task.expanded").forEach(item => {
            if (item !== card) item.classList.remove("expanded");
          });
          card.classList.toggle("expanded", !wasExpanded);
          if (!wasExpanded && tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        });
      });
      document.querySelectorAll(".status").forEach(button => {
        button.addEventListener("click", () => updateStatus(Number(button.dataset.card), Number(button.dataset.column)));
      });
    }

    async function loadTasks() {
      setActiveTab();
      content.innerHTML = `<div class="glass loader">Yuklanmoqda...</div>`;
      try {
        const data = await api(`/projects/task-webapp/tasks?status=${state.filter}`);
        const fullName = `${data.user?.name || ""} ${data.user?.surname || ""}`.trim();
        userLine.textContent = fullName ? `Hi, ${fullName}` : "CIMS Task Bot";
        openCount.textContent = data.counts?.open ?? 0;
        doneCount.textContent = data.counts?.done ?? 0;
        renderTasks(data.tasks || []);
      } catch (error) {
        visibleCount.textContent = 0;
        content.innerHTML = `<div class="glass error">⛔ ${escapeHtml(error.message)}<br><br>Botga /start bosing va qayta oching.</div>`;
      }
    }

    async function updateStatus(cardId, columnId) {
      try {
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        await api(`/projects/task-webapp/tasks/${cardId}/status`, {
          method: "PATCH",
          body: JSON.stringify({ column_id: columnId })
        });
        await loadTasks();
      } catch (error) {
        if (tg?.showAlert) tg.showAlert(error.message);
        else alert(error.message);
      }
    }

    document.addEventListener("pointermove", setPointer, { passive: true });
    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        loadTasks();
      });
    });
    document.getElementById("refreshBtn").addEventListener("click", loadTasks);
    loadTasks();
  </script>
</body>
</html>
